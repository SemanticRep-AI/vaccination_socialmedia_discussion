[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engagement-sampling"
version = "1.0.0"
description = "Design-based sampling for large social media corpora"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "openpyxl>=3.1",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
engagement-sampling = "engagement_sampling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
